settings:
  content:
    merge: true

media:
  - name: covers
    label: Обложки викторин
    input: img/covers
    output: img/covers
    categories: [image]
    extensions: [jpg, jpeg, png, webp, avif, svg]
    rename: false
  - name: quiz_images
    label: Изображения вопросов
    input: img/quiz
    output: img/quiz
    categories: [image]
    extensions: [jpg, jpeg, png, webp, avif, svg]
    rename: false
  - name: vocabulary_files
    label: Словари Excel
    input: data/vocabulary
    output: ../vocabulary
    categories: [spreadsheet]
    extensions: [xlsx, csv]
    rename: false

content:
  - name: tags
    label: Теги
    type: collection
    path: data/tags
    format: json
    filename:
      template: "{fields.slug}.json"
      field: false
    view:
      fields: [name, slug, published]
      primary: name
      sort: [name]
      search: [name, slug]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: Название
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: Используйте латинские строчные буквы, цифры и дефисы.
      - name: published
        label: Опубликован
        type: boolean
        required: true
        default: true

  - name: quizzes
    label: Викторины
    type: collection
    path: data/quizzes
    format: json
    filename:
      template: "{fields.slug}.json"
      field: false
    view:
      primary: title
      fields: [title, slug, published, publication_date]
      sort: [publication_date, title]
      search: [title, slug, short_description]
      default:
        sort: publication_date
        order: desc
    fields:
      - name: title
        label: Название
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: Используйте латинские строчные буквы, цифры и дефисы.
      - name: published
        label: Опубликована
        type: boolean
        required: true
        default: false
      - name: publication_date
        label: Дата и время публикации
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ssxxx
          step: 60
      - name: difficulty
        label: Уровень сложности
        type: select
        required: true
        default: low
        options:
          values:
            - name: low
              label: Низкая
            - name: medium
              label: Средняя
            - name: high
              label: Высокая
      - name: short_description
        label: Краткое описание
        type: text
        required: true
        options:
          maxlength: 250
      - name: intro
        label: Вступительный текст
        type: text
        required: true
      - name: cover
        label: Квадратная обложка
        type: image
        required: false
        description: Рекомендуемое соотношение сторон — 1:1.
        options:
          media: covers
          categories: [image]
          rename: false
      - name: questionImagesAlt
        label: Общий alt для изображений вопросов
        type: string
        required: false
        description: Используется для всех изображений вопросов этой викторины. Не указывайте правильный ответ.
      - name: tags
        label: Теги
        type: reference
        required: true
        options:
          collection: tags
          multiple: true
          min: 1
          search: "name,slug"
          value: "{fields.slug}"
          label: "{fields.name}"
      - name: next_quiz
        label: Следующая викторина
        type: reference
        required: false
        options:
          collection: quizzes
          multiple: false
          search: "title,slug"
          value: "{fields.slug}"
          label: "{fields.title}"
      - name: questions
        label: Вопросы
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{index}. {question}"
        fields:
          - name: id
            type: string
            hidden: true
            required: false
          - name: question
            label: Текст вопроса
            type: text
            required: true
          - name: image
            label: Изображение
            type: image
            required: false
            options:
              media: quiz_images
              categories: [image]
              rename: false
          - name: answers
            label: Варианты ответа
            type: object
            required: true
            list:
              min: 2
              max: 6
              collapsible:
                collapsed: true
                summary: "Вариант {index}: {text}"
            fields:
              - name: id
                type: string
                hidden: true
                required: false
              - name: text
                label: false
                type: string
                required: true
          - name: correct_answer_id
            label: Правильный вариант
            type: select
            required: true
            description: Выберите один вариант по его номеру в списке выше.
            options:
              multiple: false
              placeholder: Выберите правильный вариант
              values: [answer-01, answer-02, answer-03, answer-04, answer-05, answer-06]
          - name: explanation
            label: Объяснение
            type: text
            required: true
          - name: image_source
            label: Источник изображения
            type: string
            required: false
          - name: image_author
            label: Автор изображения
            type: string
            required: false
          - name: image_source_url
            label: Ссылка на источник
            type: string
            required: false
            pattern:
              regex: "^$|^https?://.+$"
              message: Укажите полный адрес с http:// или https:// либо оставьте поле пустым.

  - name: vocabulary_quizzes
    label: Словарные викторины
    type: collection
    path: data/vocabulary-quizzes
    format: json
    filename:
      template: "{fields.slug}.json"
      field: false
    view:
      primary: title
      fields: [title, slug, published, publication_date]
      sort: [publication_date, title]
      search: [title, slug, short_description]
      default:
        sort: publication_date
        order: desc
    fields:
      - name: type
        type: string
        hidden: true
        required: true
        default: vocabulary
      - name: title
        label: Название
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: Используйте латинские строчные буквы, цифры и дефисы.
      - name: published
        label: Опубликована
        type: boolean
        required: true
        default: false
      - name: publication_date
        label: Дата и время публикации
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ssxxx
          step: 60
      - name: difficulty
        label: Уровень сложности
        type: select
        required: true
        default: low
        options:
          values:
            - name: low
              label: Низкая
            - name: medium
              label: Средняя
            - name: high
              label: Высокая
      - name: short_description
        label: Краткое описание
        type: text
        required: true
        options:
          maxlength: 250
      - name: intro
        label: Вступительный текст
        type: text
        required: true
      - name: cover
        label: Квадратная обложка
        type: image
        required: false
        description: Рекомендуемое соотношение сторон — 1:1.
        options:
          media: covers
          categories: [image]
          rename: false
      - name: tags
        label: Теги
        type: reference
        required: true
        options:
          collection: tags
          multiple: true
          min: 1
          search: "name,slug"
          value: "{fields.slug}"
          label: "{fields.name}"
      - name: next_quiz
        label: Следующая викторина
        type: reference
        required: false
        options:
          collection: quizzes
          multiple: false
          search: "title,slug"
          value: "{fields.slug}"
          label: "{fields.title}"
      - name: parts
        label: Части словаря
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{index}. {title}"
        fields:
          - name: id
            type: uuid
            required: true
            options:
              editable: false
          - name: title
            label: Название части
            type: string
            required: false
          - name: table
            label: Таблица словаря
            type: file
            required: true
            description: Таблица .xlsx или .csv со столбцами English, Russian и Category. Содержимое проверяется при сборке сайта.
            options:
              media: vocabulary_files
              extensions: [xlsx, csv]
              rename: false
