name: Prepare English translation package

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: english-quiz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare English structure and translation package
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
        run: python scripts/sync_english_quiz.py --payload "$PAGES_CMS_PAYLOAD" --summary "$GITHUB_STEP_SUMMARY"

      - name: Validate generated content
        run: |
          if ! python tools/build_site.py --check; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Errors" >> "$GITHUB_STEP_SUMMARY"
            echo "- Generated content did not pass tools/build_site.py --check; no commit was created." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Commit English version
        run: |
          git add -A data/quizzes data/english-quizzes data/translation-packages
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare English translation package"
          git push origin HEAD:${GITHUB_REF_NAME}
