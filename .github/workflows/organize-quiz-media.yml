name: Organize quiz media

on:
  push:
    branches:
      - main
    paths:
      - "data/quizzes/*.json"
      - "data/quizzes/**/*.json"
      - "data/vocabulary-quizzes/*.json"
      - "data/english-quizzes/*.json"
      - "data/tags/*.json"
      - "data/vocabulary/*.xlsx"
      - "data/vocabulary/*.csv"
      - "img/covers/*"
      # Published quiz images live below a slug directory. Raw Pages CMS
      # uploads live directly in img/quiz and deliberately do not match.
      - "img/quiz/**/*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: organize-quiz-media
  cancel-in-progress: true

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Organize images and commit changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_REF: ${{ github.event.before }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pages CMS uploads a newly selected file before it saves the JSON.
          # A push containing only new files at the CMS media roots is therefore
          # intermediate. Existing-file replacements have status M and continue,
          # so replacing an already published cover still results in a deploy.
          if [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${PREVIOUS_REF}" && ! "${PREVIOUS_REF}" =~ ^0+$ ]]; then
            mapfile -t cms_changes < <(git diff --name-status "${PREVIOUS_REF}" "${GITHUB_SHA}")
            intermediate_upload=true
            for change in "${cms_changes[@]}"; do
              status="${change%%$'\t'*}"
              path="${change#*$'\t'}"
              if [[ "${status}" != "A" || ! "${path}" =~ ^img/(covers|quiz)/[^/]+$ ]]; then
                intermediate_upload=false
                break
              fi
            done
            if [[ "${#cms_changes[@]}" -gt 0 && "${intermediate_upload}" == "true" ]]; then
              echo "Only intermediate Pages CMS image uploads changed; skipping finalization and Pages dispatch."
              exit 0
            fi
          fi

          for attempt in 1 2 3; do
            echo "Attempt ${attempt}"

            git fetch origin main
            git reset --hard origin/main

            python scripts/organize_quiz_media.py --previous-ref "${PREVIOUS_REF}"
            python scripts/cleanup_deleted_tags.py --previous-ref "${PREVIOUS_REF}"
            python scripts/finalize_vocabulary_imports.py
            python scripts/mark_stale_english_quizzes.py
            python tools/build_site.py --check

            if git diff --quiet -- data/quizzes data/vocabulary-quizzes data/english-quizzes data/tags data/vocabulary img/covers img/quiz; then
              echo "Quiz media is already organized."
              gh workflow run pages.yml --ref main
              exit 0
            fi

            git add -A data/quizzes data/vocabulary-quizzes data/english-quizzes data/tags data/vocabulary img/covers img/quiz
            git commit -m "Organize quiz media"

            if git push origin HEAD:main; then
              gh workflow run pages.yml --ref main
              exit 0
            fi

            echo "Remote main changed; retrying from the newest commit."
            sleep 5
          done

          echo "Could not push organized media after three attempts."
          exit 1
